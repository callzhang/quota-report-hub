<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Token Usage · Quota Report Hub</title>
    <style>
      :root {
        --bg: #f4efe7;
        --panel: rgba(255, 251, 245, 0.94);
        --ink: #1d1915;
        --muted: #6d6154;
        --line: rgba(75, 52, 31, 0.14);
        --accent: #1f6d68;
        --bad: #b23a32;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        background:
          radial-gradient(circle at top left, rgba(31, 109, 104, 0.18), transparent 26%),
          radial-gradient(circle at top right, rgba(206, 96, 48, 0.16), transparent 28%),
          linear-gradient(180deg, #f9f4ea 0%, #ece0ce 100%);
        font-family: "Avenir Next", "Segoe UI", sans-serif;
      }
      main { max-width: 1520px; margin: 0 auto; padding: 28px 24px 48px; }
      .hero, .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 24px;
        box-shadow: 0 18px 54px rgba(77, 58, 37, 0.09);
      }
      .hero { padding: 28px; display: grid; gap: 14px; }
      .hero-top { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
      h1 { margin: 0; font: 52px/0.95 "Iowan Old Style", serif; }
      h2 { margin: 0 0 14px; font-size: 18px; }
      .tab-nav { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px; }
      .tab-nav a {
        display: inline-flex; align-items: center; min-height: 40px; padding: 8px 20px;
        border: 1px solid var(--line); border-radius: 999px; text-decoration: none;
        font-weight: 600; color: var(--muted); background: var(--panel);
        box-shadow: 0 8px 24px rgba(77, 58, 37, 0.05);
      }
      .tab-nav a:hover { color: var(--ink); }
      .tab-nav a.active { color: #fff8f0; background: var(--accent); border-color: transparent; }
      .meta { color: var(--muted); }
      .panel { margin-top: 18px; padding: 20px; }
      .filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; }
      label { display: grid; gap: 6px; color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .04em; }
      input, select, button {
        width: 100%; min-height: 42px; padding: 9px 11px; border: 1px solid var(--line);
        border-radius: 12px; background: rgba(255,255,255,.82); color: var(--ink); font: inherit;
      }
      button { cursor: pointer; width: auto; }
      .actions { display: flex; align-items: end; gap: 10px; }
      .primary { background: var(--accent); color: #fff; border-color: transparent; }
      .regions { display: grid; grid-template-columns: repeat(12, 1fr); gap: 18px; }
      .regions .panel { grid-column: span 12; }
      #summary-region { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
      .summary-card { border: 1px solid var(--line); border-radius: 16px; padding: 16px; background: rgba(255,255,255,.55); }
      .summary-card strong { display: block; margin-top: 6px; font-size: 28px; }
      #user-usage-region { display: grid; gap: 8px; }
      .user-bar-row {
        display: grid; grid-template-columns: minmax(150px, 240px) 1fr max-content;
        align-items: center; gap: 12px;
      }
      .user-bar-label { overflow-wrap: anywhere; word-break: break-word; }
      .user-bar-track { height: 14px; border-radius: 4px; background: rgba(31, 109, 104, 0.1); }
      .user-bar-fill { height: 100%; min-width: 2px; border-radius: 0 4px 4px 0; background: var(--accent); }
      .user-bar-value { font-variant-numeric: tabular-nums; white-space: nowrap; }
      .error { margin-top: 14px; padding: 12px 14px; border: 1px solid rgba(178,58,50,.25); border-radius: 12px; color: var(--bad); }
      .empty { color: var(--muted); padding: 18px 0; }
      table { width: 100%; border-collapse: collapse; }
      th, td { padding: 11px 10px; text-align: left; border-bottom: 1px solid var(--line); }
      th { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .07em; }
      .table-shell { overflow-x: auto; }
      .breakdown-pagination { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-top:14px; }
      .pager-actions { display:flex; align-items:center; gap:8px; }
      .pager-actions button:disabled { cursor:default; opacity:.45; }
      .trend-canvas-shell { position: relative; height: 300px; margin-top: 12px; }
    </style>
  </head>
  <body>
    <main>
      <section class="hero">
        <div class="hero-top">
          <div class="meta">Team usage by Hub user, provider account, and raw model name. Data is collected every guard cycle.</div>
          <div id="viewer" class="meta"></div>
        </div>
        <h1>Token Usage</h1>
      </section>

      <nav class="tab-nav" aria-label="Hub sections">
        <a href="./#accounts">Accounts</a>
        <a href="./#devices">Devices</a>
        <a class="active" aria-current="page">Usages</a>
        <a href="./users.html">Users</a>
        <a href="./#settings">Settings</a>
      </nav>

      <section class="panel" aria-labelledby="filters-title">
        <h2 id="filters-title">Query</h2>
        <div class="filters">
          <label>Start <input id="start" type="datetime-local" /></label>
          <label>End <input id="end" type="datetime-local" /></label>
          <label>Hub user <input id="hub-user" placeholder="email, email" /></label>
          <label>Provider
            <select id="provider"><option value="">All</option><option value="codex">Codex</option><option value="claude">Claude</option></select>
          </label>
          <label>Model account <input id="model-account" placeholder="account id" /></label>
          <label>Raw model <input id="model" placeholder="gpt-5.5, claude-opus…" /></label>
          <label>Granularity
            <select id="granularity"><option value="15m">15 minutes</option><option value="hour">Hourly</option><option value="day">Daily</option></select>
          </label>
          <label>Group by
            <select id="group-by">
              <option value="hub_user">Hub user</option><option value="provider">Provider</option>
              <option value="model_account">Model account</option><option value="model">Model</option>
            </select>
          </label>
          <label>Metric
            <select id="metric">
              <option value="total">Total</option><option value="input">Input</option><option value="output">Output</option>
              <option value="cache_read">Cache read</option><option value="cache_write">Cache write</option><option value="reasoning">Reasoning</option>
            </select>
          </label>
          <div class="actions"><button id="apply" class="primary">Apply</button><button id="retry">Retry</button></div>
        </div>
        <div id="error-region" class="error" role="alert" hidden></div>
      </section>

      <div class="regions">
        <section class="panel" aria-labelledby="summary-title">
          <h2 id="summary-title">Summary</h2>
          <div id="summary-region" aria-live="polite"></div>
        </section>
        <section class="panel" aria-labelledby="user-usage-title">
          <h2 id="user-usage-title">Usage by user</h2>
          <div id="user-usage-region"></div>
        </section>
        <section class="panel" id="trend-panel" aria-labelledby="trend-title">
          <h2 id="trend-title">Trend</h2>
          <div id="trend-region"></div>
        </section>
        <section class="panel" aria-labelledby="breakdown-title">
          <h2 id="breakdown-title">Breakdown</h2>
          <div id="breakdown-region" class="table-shell"></div>
        </section>
      </div>
    </main>

    <!-- The trend chart is Chart.js, an off-the-shelf component; the second script bundles the
         date-fns adapter its time axis needs. Pinned versions, UMD builds. -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <script>
      const COOKIE_NAME = "quota_report_hub_token";
      const QUERY_CACHE_MS = 5 * 60 * 1000;
      const queryCache = new Map();
      const queryRequests = new Map();
      let authSessionGeneration = 0;
      let currentToken = "";
      let lastSuccessfulPayload = null;
      let pendingBreakdownFocus = false;
      const BREAKDOWN_PAGE_SIZE = 20;
      let breakdownPage = 1;

      const start = document.getElementById("start");
      const end = document.getElementById("end");
      const hubUser = document.getElementById("hub-user");
      const provider = document.getElementById("provider");
      const modelAccount = document.getElementById("model-account");
      const model = document.getElementById("model");
      const granularity = document.getElementById("granularity");
      const groupBy = document.getElementById("group-by");
      const metric = document.getElementById("metric");
      const summaryRegion = document.getElementById("summary-region");
      const userUsageRegion = document.getElementById("user-usage-region");
      const trendRegion = document.getElementById("trend-region");
      const breakdownRegion = document.getElementById("breakdown-region");
      const errorRegion = document.getElementById("error-region");
      const applyButton = document.getElementById("apply");
      const retryButton = document.getElementById("retry");

      function getCookie(name) {
        const prefix = `${name}=`;
        return document.cookie.split(";").map((part) => part.trim())
          .find((part) => part.startsWith(prefix))?.slice(prefix.length) || "";
      }

      function safeDecodeCookieValue(value) {
        try { return decodeURIComponent(value); } catch { return ""; }
      }

      function getStoredToken() { return safeDecodeCookieValue(getCookie(COOKIE_NAME)); }

      function setTokenCookie(token) {
        const secure = location.protocol === "https:" ? "; Secure" : "";
        document.cookie = `${COOKIE_NAME}=${encodeURIComponent(token)}; Path=/; Max-Age=${60 * 60 * 24 * 30}; SameSite=Lax${secure}`;
      }

      function clearTokenCookie() {
        document.cookie = `${COOKIE_NAME}=; Path=/; Max-Age=0; SameSite=Lax`;
      }

      function setCurrentToken(token) {
        if (token === currentToken) return;
        currentToken = token;
        authSessionGeneration += 1;
        queryCache.clear();
        queryRequests.clear();
        if (token) setTokenCookie(token); else clearTokenCookie();
      }

      function loginReturn() {
        location.replace("/login.html?next=%2Ftoken-usage.html");
      }

      function escapeHtml(value) {
        return String(value ?? "").replace(/[&<>"']/g, (character) => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
        }[character]));
      }

      function number(value) { return Number(value || 0).toLocaleString(); }

      // Raw token counts run into 12 digits and stop being readable; the team reads 万/亿.
      // Visible text carries the scaled unit, and callers keep the exact count in a title.
      function formatTokens(value) {
        const n = Number(value || 0);
        const abs = Math.abs(n);
        for (const [unit, suffix] of [[1e12, "万亿"], [1e8, "亿"], [1e4, "万"]]) {
          if (abs >= unit) {
            const scaled = n / unit;
            const digits = Math.abs(scaled) >= 100 ? 0 : Math.abs(scaled) >= 10 ? 1 : 2;
            return `${scaled.toFixed(digits)}${suffix}`;
          }
        }
        return n.toLocaleString();
      }

      const COUNTERS = [
        ["Total", "total_tokens"], ["Input", "input_tokens"], ["Output", "output_tokens"],
        ["Cache read", "cache_read_tokens"], ["Cache write", "cache_write_tokens"],
        ["Reasoning", "reasoning_tokens"],
      ];

      function selectedMetricCounter() {
        return {
          total: "total_tokens", input: "input_tokens", output: "output_tokens",
          cache_read: "cache_read_tokens", cache_write: "cache_write_tokens",
          reasoning: "reasoning_tokens",
        }[metric.value] || "total_tokens";
      }

      function stableColor(value) {
        let hash = 0;
        for (const character of String(value)) hash = ((hash << 5) - hash + character.charCodeAt(0)) | 0;
        return `hsl(${Math.abs(hash) % 360} 52% 42%)`;
      }

      function groupLabel() {
        return { hub_user: "Hub user", provider: "Provider", model_account: "Model account", model: "Model" }[groupBy.value] || "Group";
      }

      function trendBucketMs() {
        return granularity.value === "day" ? 24 * 60 * 60 * 1000
          : granularity.value === "15m" ? 15 * 60 * 1000
          : 60 * 60 * 1000;
      }

      // Chart.js draws the trend; this stays a pure config builder so tests can assert on the
      // datasets and options without a canvas. Colors follow the entity (stableColor), a missing
      // bucket becomes an explicit null point so the line breaks instead of bridging the gap.
      function trendChartConfig(points) {
        const metricCounter = selectedMetricCounter();
        const sorted = [...points].sort((a, b) =>
          String(a.bucket_start).localeCompare(String(b.bucket_start)) || String(a.group_value).localeCompare(String(b.group_value))
        );
        const byGroup = new Map();
        for (const point of sorted) {
          const key = String(point.group_value || "Unknown");
          if (!byGroup.has(key)) byGroup.set(key, []);
          byGroup.get(key).push(point);
        }
        const bucketMs = trendBucketMs();
        const datasets = [...byGroup.entries()].map(([group, groupPoints]) => {
          const data = [];
          let previousTime = null;
          for (const point of groupPoints) {
            const time = Date.parse(point.bucket_start);
            if (previousTime !== null && time - previousTime > bucketMs * 1.5) {
              data.push({ x: previousTime + bucketMs, y: null });
            }
            data.push({ x: time, y: Number(point[metricCounter] || 0) });
            previousTime = time;
          }
          const color = stableColor(group);
          return {
            label: group,
            data,
            borderColor: color,
            backgroundColor: color,
            borderWidth: 1.8,
            pointRadius: 2.5,
            pointHoverRadius: 5,
            spanGaps: false,
          };
        });
        return {
          type: "line",
          data: { datasets },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: "nearest", intersect: false },
            scales: {
              x: { type: "time" },
              y: { beginAtZero: true, ticks: { callback: (value) => formatTokens(value) } },
            },
            plugins: {
              tooltip: {
                callbacks: {
                  label: (item) => `${item.dataset.label}: ${formatTokens(item.parsed.y)}`,
                },
              },
            },
          },
        };
      }

      let trendChart = null;
      function renderTrendChart(points) {
        if (trendChart) {
          trendChart.destroy();
          trendChart = null;
        }
        if (!points.length) {
          trendRegion.innerHTML = '<div class="empty">No usage in this range.</div>';
          return;
        }
        trendRegion.innerHTML =
          `<div class="meta">Trend · ${escapeHtml(selectedMetricLabel())} · ${escapeHtml(groupLabel())}. Missing buckets remain gaps; hover a point for the exact value.</div>` +
          `<div class="trend-canvas-shell"><canvas role="img" aria-label="Token usage trend by ${escapeHtml(groupLabel())}"></canvas></div>`;
        trendChart = new Chart(trendRegion.querySelector("canvas"), trendChartConfig(points));
      }

      function selectedMetricLabel() {
        return COUNTERS.find(([, key]) => key === selectedMetricCounter())?.[0] || "Total";
      }

      function renderUserBars(rows) {
        const metricCounter = selectedMetricCounter();
        const byUser = new Map();
        for (const row of rows) {
          const key = row.hub_user_email || "Unknown";
          byUser.set(key, (byUser.get(key) || 0) + Number(row[metricCounter] || 0));
        }
        const entries = [...byUser.entries()].sort((a, b) => b[1] - a[1]);
        const total = entries.reduce((sum, [, value]) => sum + value, 0);
        if (!total) return '<div class="empty">No usage in this range.</div>';
        const max = entries[0][1];
        const label = selectedMetricLabel();
        return `<div class="meta">${escapeHtml(label)} tokens per Hub user under the current filters · % is the share of the filtered total (${formatTokens(total)})</div>` +
          entries.map(([email, value]) => {
            const share = (value / total) * 100;
            return `
            <div class="user-bar-row" title="${escapeHtml(`${email}: ${number(value)} ${label.toLowerCase()} tokens · ${share.toFixed(1)}% of filtered total`)}">
              <div class="user-bar-label">${escapeHtml(email)}</div>
              <div class="user-bar-track"><div class="user-bar-fill" style="width: ${((value / max) * 100).toFixed(2)}%"></div></div>
              <div class="user-bar-value">${formatTokens(value)}<span class="meta"> · ${share.toFixed(1)}%</span></div>
            </div>`;
          }).join("");
      }

      function renderBreakdown(rows) {
        const sortedRows = [...rows].sort((a, b) => Number(b.total_tokens || 0) - Number(a.total_tokens || 0));
        breakdownRegion.dataset.rows = JSON.stringify(sortedRows);
        breakdownPage = 1;
        return renderBreakdownPage();
      }

      function renderBreakdownPage() {
        const rows = JSON.parse(breakdownRegion.dataset.rows || "[]");
        if (!rows.length) return '<div class="empty">No usage in this range.</div>';
        const pageCount = Math.max(1, Math.ceil(rows.length / BREAKDOWN_PAGE_SIZE));
        breakdownPage = Math.min(pageCount, Math.max(1, breakdownPage));
        const startIndex = (breakdownPage - 1) * BREAKDOWN_PAGE_SIZE;
        const endIndex = Math.min(rows.length, startIndex + BREAKDOWN_PAGE_SIZE);
        const headers = ["Hub user", "Provider", "Model account", "Model", ...COUNTERS.map(([label]) => label)];
        const body = rows.slice(startIndex, endIndex).map((row, index) => `<tr>` +
          `<td><button id="breakdown-${index}" data-breakdown-index="${startIndex + index}" aria-label="Filter to ${escapeHtml(row.hub_user_email)}, ${escapeHtml(row.provider)}, ${escapeHtml(row.model_account_id)}, ${escapeHtml(row.model_id)}">${escapeHtml(row.hub_user_email)}</button></td>` +
          `<td>${escapeHtml(row.provider)}</td><td>${escapeHtml(row.model_account_id)}</td><td>${escapeHtml(row.model_id)}</td>` +
          COUNTERS.map(([, key]) => `<td title="${number(row[key])}">${formatTokens(row[key])}</td>`).join("") + `</tr>`).join("");
        const previousDisabled = breakdownPage === 1 ? " disabled" : "";
        const nextDisabled = breakdownPage === pageCount ? " disabled" : "";
        return `<div data-breakdown-table><table><thead><tr>${headers.map((header) => `<th>${header}</th>`).join("")}</tr></thead><tbody>${body}</tbody></table></div>` +
          `<div class="breakdown-pagination" aria-label="Breakdown pagination"><span class="meta" data-breakdown-range>Showing ${startIndex + 1}–${endIndex} of ${rows.length}</span>` +
          `<div class="pager-actions"><button data-breakdown-page="previous" aria-label="Previous breakdown page"${previousDisabled}>Previous</button>` +
          `<span aria-live="polite" data-breakdown-page-status>Page ${breakdownPage} of ${pageCount}</span><button data-breakdown-page="next" aria-label="Next breakdown page"${nextDisabled}>Next</button></div></div>`;
      }

      function goToBreakdownPage(delta) {
        const rows = JSON.parse(breakdownRegion.dataset.rows || "[]");
        const pageCount = Math.max(1, Math.ceil(rows.length / BREAKDOWN_PAGE_SIZE));
        breakdownPage = Math.min(pageCount, Math.max(1, breakdownPage + delta));
        const table = breakdownRegion.querySelector("[data-breakdown-table]");
        if (!table) {
          breakdownRegion.innerHTML = renderBreakdownPage();
          bindBreakdownActions();
          return;
        }
        const pageMarkup = renderBreakdownPage();
        table.innerHTML = pageMarkup.match(/<div data-breakdown-table>([\s\S]*?)<\/div>/)?.[1] || "";
        const range = pageMarkup.match(/data-breakdown-range>[^<]+/)?.[0]?.replace("data-breakdown-range>", "");
        breakdownRegion.querySelector("[data-breakdown-range]").textContent = range || "";
        breakdownRegion.querySelector("[data-breakdown-page-status]").textContent = `Page ${breakdownPage} of ${pageCount}`;
        breakdownRegion.querySelector("[data-breakdown-page=previous]").disabled = breakdownPage === 1;
        breakdownRegion.querySelector("[data-breakdown-page=next]").disabled = breakdownPage === pageCount;
        bindBreakdownActions();
      }

      function bindBreakdownActions() {
        const rows = JSON.parse(breakdownRegion.dataset.rows || "[]");
        breakdownRegion.querySelectorAll("[data-breakdown-index]").forEach((button) => {
          button.addEventListener("click", () => applyBreakdownFilters(rows[Number(button.dataset.breakdownIndex)]));
        });
        breakdownRegion.querySelectorAll("[data-breakdown-page]").forEach((button) => {
          if (button.dataset.breakdownBound) return;
          button.dataset.breakdownBound = "true";
          button.addEventListener("click", () => goToBreakdownPage(button.dataset.breakdownPage === "previous" ? -1 : 1));
        });
        if (pendingBreakdownFocus) {
          document.getElementById("breakdown-0")?.focus();
          pendingBreakdownFocus = false;
        }
      }

      function updateUrlState() {
        history.replaceState(null, "", `${location.pathname}?${currentQueryString()}`);
      }

      async function applyBreakdownFilters(row) {
        breakdownPage = 1;
        hubUser.value = row.hub_user_email || "";
        provider.value = row.provider || "";
        modelAccount.value = row.model_account_id || "";
        model.value = row.model_id || "";
        pendingBreakdownFocus = true;
        updateUrlState();
        return loadUsage();
      }

      function localInputValue(date) {
        const shifted = new Date(date.getTime() - date.getTimezoneOffset() * 60000);
        return shifted.toISOString().slice(0, 16);
      }

      function inputIso(input) {
        const parsed = new Date(input.value);
        return parsed.toISOString();
      }

      function appendRepeated(params, key, rawValue) {
        String(rawValue || "").split(",").map((value) => value.trim()).filter(Boolean)
          .forEach((value) => params.append(key, value));
      }

      function currentQueryString() {
        const params = new URLSearchParams();
        params.set("start", inputIso(start));
        params.set("end", inputIso(end));
        params.set("granularity", granularity.value);
        params.set("group_by", groupBy.value);
        params.set("metric", metric.value);
        appendRepeated(params, "hub_user", hubUser.value);
        appendRepeated(params, "provider", provider.value);
        appendRepeated(params, "model_account", modelAccount.value);
        appendRepeated(params, "model", model.value);
        params.sort();
        return params.toString();
      }

      function renderShell(payload) {
        const totals = payload.totals || {};
        summaryRegion.innerHTML = [
          `<article class="summary-card"><span class="meta">Total</span><strong title="${number(totals.total_tokens)}">${formatTokens(totals.total_tokens)}</strong><div class="meta">All provider-reported tokens</div></article>`,
          `<article class="summary-card"><span class="meta">Input</span><strong title="${number(totals.input_tokens)}">${formatTokens(totals.input_tokens)}</strong><div class="meta">Provider input counter</div></article>`,
          `<article class="summary-card"><span class="meta">Output</span><strong title="${number(totals.output_tokens)}">${formatTokens(totals.output_tokens)}</strong><div class="meta">Provider output counter</div></article>`,
          `<article class="summary-card"><span class="meta">Cache</span><strong title="${number(Number(totals.cache_read_tokens || 0) + Number(totals.cache_write_tokens || 0))}">${formatTokens(Number(totals.cache_read_tokens || 0) + Number(totals.cache_write_tokens || 0))}</strong>` +
            `<div class="meta">Cache read ${formatTokens(totals.cache_read_tokens)} · Cache write ${formatTokens(totals.cache_write_tokens)} · Reasoning ${formatTokens(totals.reasoning_tokens)}. These are subsets of Total, not additions.</div></article>`,
        ].join("");
        userUsageRegion.innerHTML = renderUserBars(payload.breakdown || []);
        renderTrendChart(payload.trend || []);
        breakdownRegion.innerHTML = renderBreakdown(payload.breakdown || []);
        bindBreakdownActions();
      }

      function showError(message) {
        errorRegion.hidden = false;
        errorRegion.innerHTML = `${escapeHtml(message)} <button id="inline-retry">Retry</button>`;
      }

      function clearError() { errorRegion.hidden = true; errorRegion.innerHTML = ""; }

      function sessionIsCurrent(token, generation) {
        return token === currentToken && generation === authSessionGeneration;
      }

      async function queryPayload(queryString) {
        const token = currentToken;
        const generation = authSessionGeneration;
        const key = `${generation}:${queryString}`;
        const cached = queryCache.get(key);
        if (cached && Date.now() - cached.fetchedAt < QUERY_CACHE_MS) return cached.payload;
        if (queryRequests.has(key)) return queryRequests.get(key);

        const request = (async () => {
          const response = await fetch(`/api/token-usage-query?${queryString}`, {
            cache: "no-store",
            headers: { Authorization: `Bearer ${token}` },
          });
          const payload = await response.json().catch(() => ({}));
          if (!sessionIsCurrent(token, generation)) throw new Error("auth session changed");
          if (response.status === 401) {
            setCurrentToken("");
            loginReturn();
            throw new Error("unauthorized");
          }
          if (!response.ok) throw new Error(payload.message || payload.error || `query failed (${response.status})`);
          if (payload.auth_pool_user_token && payload.auth_pool_user_token !== token) {
            setCurrentToken(payload.auth_pool_user_token);
          }
          const currentKey = `${authSessionGeneration}:${queryString}`;
          queryCache.set(currentKey, { fetchedAt: Date.now(), payload });
          return payload;
        })();
        queryRequests.set(key, request);
        try { return await request; }
        finally { if (queryRequests.get(key) === request) queryRequests.delete(key); }
      }

      async function loadUsage() {
        if (!currentToken) { loginReturn(); throw new Error("login required"); }
        const queryString = currentQueryString();
        applyButton.disabled = true;
        try {
          const payload = await queryPayload(queryString);
          lastSuccessfulPayload = payload;
          clearError();
          renderShell(payload);
          return payload;
        } catch (error) {
          if (error.message !== "auth session changed" && error.message !== "unauthorized") showError(error.message);
          throw error;
        } finally {
          applyButton.disabled = false;
        }
      }

      function initializeDefaults() {
        const now = new Date();
        start.value = localInputValue(new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000));
        end.value = localInputValue(now);
        granularity.value = "hour";
        groupBy.value = "hub_user";
        metric.value = "total";
      }

      applyButton.addEventListener("click", () => loadUsage().catch(() => {}));
      retryButton.addEventListener("click", () => loadUsage().catch(() => {}));
      initializeDefaults();
      currentToken = getStoredToken();
      if (!currentToken) loginReturn();
      else loadUsage().catch(() => {});
    </script>
  </body>
</html>
