<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Token Usage · Quota Report Hub</title>
    <style>
      :root {
        --bg: #f4efe7;
        --panel: rgba(255, 251, 245, 0.94);
        --ink: #1d1915;
        --muted: #6d6154;
        --line: rgba(75, 52, 31, 0.14);
        --accent: #1f6d68;
        --bad: #b23a32;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        background:
          radial-gradient(circle at top left, rgba(31, 109, 104, 0.18), transparent 26%),
          radial-gradient(circle at top right, rgba(206, 96, 48, 0.16), transparent 28%),
          linear-gradient(180deg, #f9f4ea 0%, #ece0ce 100%);
        font-family: "Avenir Next", "Segoe UI", sans-serif;
      }
      main { max-width: 1520px; margin: 0 auto; padding: 28px 24px 48px; }
      .hero, .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 24px;
        box-shadow: 0 18px 54px rgba(77, 58, 37, 0.09);
      }
      .hero { padding: 28px; display: grid; gap: 14px; }
      .hero-top { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
      h1 { margin: 0; font: 52px/0.95 "Iowan Old Style", serif; }
      h2 { margin: 0 0 14px; font-size: 18px; }
      .nav { display: flex; gap: 16px; flex-wrap: wrap; }
      .nav a { color: var(--accent); text-decoration: none; border-bottom: 1px dashed var(--accent); }
      .meta { color: var(--muted); }
      .panel { margin-top: 18px; padding: 20px; }
      .filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; }
      label { display: grid; gap: 6px; color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .04em; }
      input, select, button {
        width: 100%; min-height: 42px; padding: 9px 11px; border: 1px solid var(--line);
        border-radius: 12px; background: rgba(255,255,255,.82); color: var(--ink); font: inherit;
      }
      button { cursor: pointer; width: auto; }
      .actions { display: flex; align-items: end; gap: 10px; }
      .primary { background: var(--accent); color: #fff; border-color: transparent; }
      .regions { display: grid; grid-template-columns: repeat(12, 1fr); gap: 18px; }
      .regions .panel { grid-column: span 12; }
      #summary-region { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
      .summary-card { border: 1px solid var(--line); border-radius: 16px; padding: 16px; background: rgba(255,255,255,.55); }
      .summary-card strong { display: block; margin-top: 6px; font-size: 28px; }
      .error { margin-top: 14px; padding: 12px 14px; border: 1px solid rgba(178,58,50,.25); border-radius: 12px; color: var(--bad); }
      .empty { color: var(--muted); padding: 18px 0; }
      table { width: 100%; border-collapse: collapse; }
      th, td { padding: 11px 10px; text-align: left; border-bottom: 1px solid var(--line); }
      th { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .07em; }
      .table-shell { overflow-x: auto; }
      #trend-region svg { display: block; width: 100%; min-height: 260px; margin-top: 12px; overflow: visible; }
      .trend-legend { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px; }
      .trend-legend span { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
      .trend-legend i { width: 10px; height: 10px; border-radius: 50%; }
      @media (min-width: 920px) {
        #trend-panel { grid-column: span 8; }
        #reporter-panel { grid-column: span 4; }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="hero">
        <div class="hero-top">
          <nav class="nav" aria-label="Hub pages">
            <a href="./">Accounts</a>
            <a href="./users.html">Users</a>
          </nav>
          <div id="viewer" class="meta"></div>
        </div>
        <h1>Token Usage</h1>
        <div class="meta">Team usage by Hub user, provider account, and raw model name. Data is collected every guard cycle.</div>
      </section>

      <section class="panel" aria-labelledby="filters-title">
        <h2 id="filters-title">Query</h2>
        <div class="filters">
          <label>Start <input id="start" type="datetime-local" /></label>
          <label>End <input id="end" type="datetime-local" /></label>
          <label>Hub user <input id="hub-user" placeholder="email, email" /></label>
          <label>Provider
            <select id="provider"><option value="">All</option><option value="codex">Codex</option><option value="claude">Claude</option></select>
          </label>
          <label>Model account <input id="model-account" placeholder="account id" /></label>
          <label>Raw model <input id="model" placeholder="gpt-5.5, claude-opus…" /></label>
          <label>Granularity
            <select id="granularity"><option value="15m">15 minutes</option><option value="hour">Hourly</option><option value="day">Daily</option></select>
          </label>
          <label>Group by
            <select id="group-by">
              <option value="hub_user">Hub user</option><option value="provider">Provider</option>
              <option value="model_account">Model account</option><option value="model">Model</option>
            </select>
          </label>
          <label>Metric
            <select id="metric">
              <option value="total">Total</option><option value="input">Input</option><option value="output">Output</option>
              <option value="cache_read">Cache read</option><option value="cache_write">Cache write</option><option value="reasoning">Reasoning</option>
            </select>
          </label>
          <div class="actions"><button id="apply" class="primary">Apply</button><button id="retry">Retry</button></div>
        </div>
        <div id="error-region" class="error" role="alert" hidden></div>
      </section>

      <div class="regions">
        <section class="panel" aria-labelledby="summary-title">
          <h2 id="summary-title">Summary</h2>
          <div id="summary-region" aria-live="polite"></div>
        </section>
        <section class="panel" id="trend-panel" aria-labelledby="trend-title">
          <h2 id="trend-title">Trend</h2>
          <div id="trend-region"></div>
        </section>
        <section class="panel" id="reporter-panel" aria-labelledby="reporter-title">
          <h2 id="reporter-title">Reporter state</h2>
          <div id="reporter-region"></div>
        </section>
        <section class="panel" aria-labelledby="breakdown-title">
          <h2 id="breakdown-title">Breakdown</h2>
          <div id="breakdown-region" class="table-shell"></div>
        </section>
      </div>
    </main>

    <script>
      const COOKIE_NAME = "quota_report_hub_token";
      const QUERY_CACHE_MS = 5 * 60 * 1000;
      const queryCache = new Map();
      const queryRequests = new Map();
      let authSessionGeneration = 0;
      let currentToken = "";
      let lastSuccessfulPayload = null;
      let pendingBreakdownFocus = false;

      const start = document.getElementById("start");
      const end = document.getElementById("end");
      const hubUser = document.getElementById("hub-user");
      const provider = document.getElementById("provider");
      const modelAccount = document.getElementById("model-account");
      const model = document.getElementById("model");
      const granularity = document.getElementById("granularity");
      const groupBy = document.getElementById("group-by");
      const metric = document.getElementById("metric");
      const summaryRegion = document.getElementById("summary-region");
      const trendRegion = document.getElementById("trend-region");
      const breakdownRegion = document.getElementById("breakdown-region");
      const reporterRegion = document.getElementById("reporter-region");
      const errorRegion = document.getElementById("error-region");
      const applyButton = document.getElementById("apply");
      const retryButton = document.getElementById("retry");

      function getCookie(name) {
        const prefix = `${name}=`;
        return document.cookie.split(";").map((part) => part.trim())
          .find((part) => part.startsWith(prefix))?.slice(prefix.length) || "";
      }

      function safeDecodeCookieValue(value) {
        try { return decodeURIComponent(value); } catch { return ""; }
      }

      function getStoredToken() { return safeDecodeCookieValue(getCookie(COOKIE_NAME)); }

      function setTokenCookie(token) {
        const secure = location.protocol === "https:" ? "; Secure" : "";
        document.cookie = `${COOKIE_NAME}=${encodeURIComponent(token)}; Path=/; Max-Age=${60 * 60 * 24 * 30}; SameSite=Lax${secure}`;
      }

      function clearTokenCookie() {
        document.cookie = `${COOKIE_NAME}=; Path=/; Max-Age=0; SameSite=Lax`;
      }

      function setCurrentToken(token) {
        if (token === currentToken) return;
        currentToken = token;
        authSessionGeneration += 1;
        queryCache.clear();
        queryRequests.clear();
        if (token) setTokenCookie(token); else clearTokenCookie();
      }

      function loginReturn() {
        location.replace("/login.html?next=%2Ftoken-usage.html");
      }

      function escapeHtml(value) {
        return String(value ?? "").replace(/[&<>"']/g, (character) => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
        }[character]));
      }

      function number(value) { return Number(value || 0).toLocaleString(); }

      const COUNTERS = [
        ["Total", "total_tokens"], ["Input", "input_tokens"], ["Output", "output_tokens"],
        ["Cache read", "cache_read_tokens"], ["Cache write", "cache_write_tokens"],
        ["Reasoning", "reasoning_tokens"],
      ];

      function selectedMetricCounter() {
        return {
          total: "total_tokens", input: "input_tokens", output: "output_tokens",
          cache_read: "cache_read_tokens", cache_write: "cache_write_tokens",
          reasoning: "reasoning_tokens",
        }[metric.value] || "total_tokens";
      }

      function stableColor(value) {
        let hash = 0;
        for (const character of String(value)) hash = ((hash << 5) - hash + character.charCodeAt(0)) | 0;
        return `hsl(${Math.abs(hash) % 360} 52% 42%)`;
      }

      function groupLabel() {
        return { hub_user: "Hub user", provider: "Provider", model_account: "Model account", model: "Model" }[groupBy.value] || "Group";
      }

      function trendBucketMs() {
        return granularity.value === "day" ? 24 * 60 * 60 * 1000
          : granularity.value === "15m" ? 15 * 60 * 1000
          : 60 * 60 * 1000;
      }

      function pointLabel(point) {
        const bucketStart = new Date(point.bucket_start);
        const bucketEnd = new Date(bucketStart.getTime() + trendBucketMs());
        const dimensions = [groupLabel() + " " + point.group_value];
        if (point.provider) dimensions.push("provider " + point.provider);
        if (point.model_account_id) dimensions.push("model account " + point.model_account_id);
        if (point.model_id) dimensions.push("model " + point.model_id);
        return `${bucketStart.toLocaleString()}–${bucketEnd.toLocaleString()}, ${dimensions.join(", ")}, ` +
          COUNTERS.map(([label, key]) => `${label.toLowerCase()} ${number(point[key])}`).join(", ");
      }

      function renderTrendChart(points) {
        if (!points.length) return '<div class="empty">No usage in this range.</div>';
        const width = 760;
        const height = 260;
        const padding = { left: 48, right: 18, top: 20, bottom: 36 };
        const metricCounter = selectedMetricCounter();
        const sorted = [...points].sort((a, b) =>
          String(a.bucket_start).localeCompare(String(b.bucket_start)) || String(a.group_value).localeCompare(String(b.group_value))
        );
        const bucketRows = new Map();
        for (const point of sorted) {
          if (!bucketRows.has(point.bucket_start)) bucketRows.set(point.bucket_start, []);
          bucketRows.get(point.bucket_start).push(point);
        }
        const stacked = [];
        let maximum = 0;
        for (const rows of bucketRows.values()) {
          let base = 0;
          for (const point of rows) {
            const value = Number(point[metricCounter] || 0);
            const stackedPoint = { ...point, stack_base: base, stack_top: base + value };
            stacked.push(stackedPoint);
            base += value;
          }
          maximum = Math.max(maximum, base);
        }
        maximum = Math.max(1, maximum);
        const times = stacked.map((point) => new Date(point.bucket_start).getTime());
        const minimumTime = Math.min(...times);
        const maximumTime = Math.max(...times);
        const timeSpan = Math.max(trendBucketMs(), maximumTime - minimumTime);
        const x = (time) => padding.left + ((time - minimumTime) / timeSpan) * (width - padding.left - padding.right);
        const y = (value) => padding.top + (1 - value / maximum) * (height - padding.top - padding.bottom);
        const byGroup = new Map();
        for (const point of stacked) {
          const key = String(point.group_value || "Unknown");
          if (!byGroup.has(key)) byGroup.set(key, []);
          byGroup.get(key).push(point);
        }
        const paths = [];
        const circles = [];
        const legend = [];
        for (const [group, groupPoints] of byGroup) {
          const color = stableColor(group);
          const segments = [];
          let segment = [];
          let previousTime = null;
          for (const point of groupPoints) {
            const time = new Date(point.bucket_start).getTime();
            if (previousTime !== null && time - previousTime > trendBucketMs() * 1.5) {
              segments.push(segment);
              segment = [];
            }
            segment.push({ point, time });
            previousTime = time;
          }
          if (segment.length) segments.push(segment);
          for (const entries of segments) {
            const path = entries.map(({ point, time }, index) =>
              `${index ? "L" : "M"}${x(time).toFixed(1)} ${y(point.stack_top).toFixed(1)}`
            ).join(" ");
            paths.push(`<path d="${path}" fill="none" stroke="${color}" stroke-width="3" />`);
          }
          for (const { point, time } of groupPoints.map((point) => ({ point, time: new Date(point.bucket_start).getTime() }))) {
            circles.push(`<circle cx="${x(time).toFixed(1)}" cy="${y(point.stack_top).toFixed(1)}" r="5" fill="${color}" tabindex="0" role="img" aria-label="${escapeHtml(pointLabel(point))}" />`);
          }
          legend.push(`<span><i style="background:${color}"></i>${escapeHtml(group)}</span>`);
        }
        return `<div class="meta">Stacked by ${escapeHtml(groupLabel())}. Missing buckets remain gaps; use Tab for exact values.</div>` +
          `<svg viewBox="0 0 ${width} ${height}" role="img" aria-label="Token usage trend stacked by ${escapeHtml(groupLabel())}">` +
          `<line x1="${padding.left}" y1="${height - padding.bottom}" x2="${width - padding.right}" y2="${height - padding.bottom}" stroke="currentColor" opacity=".25" />` +
          paths.join("") + circles.join("") + `</svg><div class="trend-legend">${legend.join("")}</div>`;
      }

      function renderBreakdown(rows) {
        if (!rows.length) return '<div class="empty">No usage in this range.</div>';
        const sortedRows = [...rows].sort((a, b) => Number(b.total_tokens || 0) - Number(a.total_tokens || 0));
        const headers = ["Hub user", "Provider", "Model account", "Model", ...COUNTERS.map(([label]) => label)];
        const body = sortedRows.map((row, index) => `<tr>` +
          `<td><button id="breakdown-${index}" data-breakdown-index="${index}" aria-label="Filter to ${escapeHtml(row.hub_user_email)}, ${escapeHtml(row.provider)}, ${escapeHtml(row.model_account_id)}, ${escapeHtml(row.model_id)}">${escapeHtml(row.hub_user_email)}</button></td>` +
          `<td>${escapeHtml(row.provider)}</td><td>${escapeHtml(row.model_account_id)}</td><td>${escapeHtml(row.model_id)}</td>` +
          COUNTERS.map(([, key]) => `<td>${number(row[key])}</td>`).join("") + `</tr>`).join("");
        breakdownRegion.dataset.rows = JSON.stringify(sortedRows);
        return `<table><thead><tr>${headers.map((header) => `<th>${header}</th>`).join("")}</tr></thead><tbody>${body}</tbody></table>`;
      }

      function bindBreakdownActions() {
        const rows = JSON.parse(breakdownRegion.dataset.rows || "[]");
        document.querySelectorAll("[data-breakdown-index]").forEach((button) => {
          button.addEventListener("click", () => applyBreakdownFilters(rows[Number(button.dataset.breakdownIndex)]));
        });
        if (pendingBreakdownFocus) {
          document.getElementById("breakdown-0")?.focus();
          pendingBreakdownFocus = false;
        }
      }

      function updateUrlState() {
        history.replaceState(null, "", `${location.pathname}?${currentQueryString()}`);
      }

      async function applyBreakdownFilters(row) {
        hubUser.value = row.hub_user_email || "";
        provider.value = row.provider || "";
        modelAccount.value = row.model_account_id || "";
        model.value = row.model_id || "";
        pendingBreakdownFocus = true;
        updateUrlState();
        return loadUsage();
      }

      function localInputValue(date) {
        const shifted = new Date(date.getTime() - date.getTimezoneOffset() * 60000);
        return shifted.toISOString().slice(0, 16);
      }

      function inputIso(input) {
        const parsed = new Date(input.value);
        return parsed.toISOString();
      }

      function appendRepeated(params, key, rawValue) {
        String(rawValue || "").split(",").map((value) => value.trim()).filter(Boolean)
          .forEach((value) => params.append(key, value));
      }

      function currentQueryString() {
        const params = new URLSearchParams();
        params.set("start", inputIso(start));
        params.set("end", inputIso(end));
        params.set("granularity", granularity.value);
        params.set("group_by", groupBy.value);
        params.set("metric", metric.value);
        appendRepeated(params, "hub_user", hubUser.value);
        appendRepeated(params, "provider", provider.value);
        appendRepeated(params, "model_account", modelAccount.value);
        appendRepeated(params, "model", model.value);
        params.sort();
        return params.toString();
      }

      function renderShell(payload) {
        const totals = payload.totals || {};
        summaryRegion.innerHTML = [
          `<article class="summary-card"><span class="meta">Total</span><strong>${number(totals.total_tokens)}</strong><div class="meta">All provider-reported tokens</div></article>`,
          `<article class="summary-card"><span class="meta">Input</span><strong>${number(totals.input_tokens)}</strong><div class="meta">Provider input counter</div></article>`,
          `<article class="summary-card"><span class="meta">Output</span><strong>${number(totals.output_tokens)}</strong><div class="meta">Provider output counter</div></article>`,
          `<article class="summary-card"><span class="meta">Cache</span><strong>${number(Number(totals.cache_read_tokens || 0) + Number(totals.cache_write_tokens || 0))}</strong>` +
            `<div class="meta">Cache read ${number(totals.cache_read_tokens)} · Cache write ${number(totals.cache_write_tokens)} · Reasoning ${number(totals.reasoning_tokens)}. These are subsets of Total, not additions.</div></article>`,
        ].join("");
        trendRegion.innerHTML = renderTrendChart(payload.trend || []);
        breakdownRegion.innerHTML = renderBreakdown(payload.breakdown || []);
        bindBreakdownActions();
        reporterRegion.innerHTML = (payload.reporters || []).length
          ? (payload.reporters || []).map((item) => item.last_reported_at
            ? `<div><strong>${escapeHtml(item.hub_user_email)}</strong><div class="meta">Last report ${escapeHtml(new Date(item.last_reported_at).toLocaleString())}</div></div>`
            : `<div><strong>${escapeHtml(item.hub_user_email)}</strong><div class="empty">No usage report received</div></div>`).join("")
          : '<div class="empty">No usage report received</div>';
      }

      function showError(message) {
        errorRegion.hidden = false;
        errorRegion.innerHTML = `${escapeHtml(message)} <button id="inline-retry">Retry</button>`;
      }

      function clearError() { errorRegion.hidden = true; errorRegion.innerHTML = ""; }

      function sessionIsCurrent(token, generation) {
        return token === currentToken && generation === authSessionGeneration;
      }

      async function queryPayload(queryString) {
        const token = currentToken;
        const generation = authSessionGeneration;
        const key = `${generation}:${queryString}`;
        const cached = queryCache.get(key);
        if (cached && Date.now() - cached.fetchedAt < QUERY_CACHE_MS) return cached.payload;
        if (queryRequests.has(key)) return queryRequests.get(key);

        const request = (async () => {
          const response = await fetch(`/api/token-usage-query?${queryString}`, {
            cache: "no-store",
            headers: { Authorization: `Bearer ${token}` },
          });
          const payload = await response.json().catch(() => ({}));
          if (!sessionIsCurrent(token, generation)) throw new Error("auth session changed");
          if (response.status === 401) {
            setCurrentToken("");
            loginReturn();
            throw new Error("unauthorized");
          }
          if (!response.ok) throw new Error(payload.message || payload.error || `query failed (${response.status})`);
          if (payload.auth_pool_user_token && payload.auth_pool_user_token !== token) {
            setCurrentToken(payload.auth_pool_user_token);
          }
          const currentKey = `${authSessionGeneration}:${queryString}`;
          queryCache.set(currentKey, { fetchedAt: Date.now(), payload });
          return payload;
        })();
        queryRequests.set(key, request);
        try { return await request; }
        finally { if (queryRequests.get(key) === request) queryRequests.delete(key); }
      }

      async function loadUsage() {
        if (!currentToken) { loginReturn(); throw new Error("login required"); }
        const queryString = currentQueryString();
        applyButton.disabled = true;
        try {
          const payload = await queryPayload(queryString);
          lastSuccessfulPayload = payload;
          clearError();
          renderShell(payload);
          return payload;
        } catch (error) {
          if (error.message !== "auth session changed" && error.message !== "unauthorized") showError(error.message);
          throw error;
        } finally {
          applyButton.disabled = false;
        }
      }

      function initializeDefaults() {
        const now = new Date();
        start.value = localInputValue(new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000));
        end.value = localInputValue(now);
        granularity.value = "hour";
        groupBy.value = "hub_user";
        metric.value = "total";
      }

      applyButton.addEventListener("click", () => loadUsage().catch(() => {}));
      retryButton.addEventListener("click", () => loadUsage().catch(() => {}));
      initializeDefaults();
      currentToken = getStoredToken();
      if (!currentToken) loginReturn();
      else loadUsage().catch(() => {});
    </script>
  </body>
</html>
